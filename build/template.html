<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedigree workbench</title>
<meta name="description" content="Draw a family in Pedigree Studio, then turn it into PED, GA4GH Pedigree and Phenopackets files, match its conditions to HPO and Mondo terms, and check, de-identify and convert pedigree files – with point-and-click tools, a Python notebook and a terminal, all in your browser.">

<link rel="stylesheet" href="assets/vendor/codemirror/codemirror.css">

<body data-page="workbench" data-title="Pedigree workbench">
<div class="app">

  <header class="topbar">
    <button class="tbtn top-toggle" id="helpToggle" type="button" title="Show or hide the help (Ctrl+\)" aria-controls="helpPane" aria-expanded="true"><!--ICON:sidebar--></button>
    <a class="brand" href="#" title="Pedigree workbench">
      <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="26" fill="#20384E"/><rect x="22" y="24" width="28" height="28" rx="3" fill="none" stroke="#F5FAFC" stroke-width="7"/><circle cx="92" cy="38" r="14" fill="none" stroke="#F5FAFC" stroke-width="7"/><path d="M50 38h28M64 38v26M38 64h52M38 64v12M90 64v12" fill="none" stroke="#62D5BD" stroke-width="7" stroke-linecap="round"/><rect x="25" y="78" width="26" height="26" rx="3" fill="#62D5BD"/><circle cx="90" cy="91" r="13" fill="none" stroke="#F5FAFC" stroke-width="7"/></svg>
      <div>
        <div class="brand-title">Pedigree workbench</div>
        <div class="brand-sub">Pedigree Studio · conversions · GA4GH and Phenopackets · ontology terms – in your browser</div>
      </div>
    </a>
    <div class="spacer"></div>
    <span class="store-status" id="storeStatus" title="Your files and drawings are kept in this browser, on this computer"></span>
    <button class="btn" id="userBtn" type="button" title="Put your name into the workbench, and the terminal will show it in place of user"><!--ICON:user--><span class="user-name">user</span></button>
    <button class="btn" id="projectBtn" type="button" title="Download all your files, add files, or start afresh"><!--ICON:folder--><span>My files</span></button>
    <button class="btn" id="fullBtn" type="button" title="Full screen (F11 also works)"><!--ICON:expand--><span>Full screen</span></button>
  </header>

  <div class="main">
    <aside class="tut help-pane" id="helpPane" aria-label="Help">
      <div class="help-head">
        <button class="icon-btn help-home" type="button" title="Help: all topics" data-goto="h-home"><!--ICON:book2--></button>
        <div class="help-search"><!--ICON:search--><input id="helpSearch" type="search" placeholder="Search the help (e.g. PED, KIN, de-identify)" autocomplete="off" aria-label="Search the help"></div>
        <button class="icon-btn help-collapse" id="helpCollapse" type="button" title="Hide the help so the workbench fills the window (Ctrl+\)"><!--ICON:sidebarClose--></button>
      </div>
      <div class="help-crumbs" id="helpCrumbs"></div>
      <div class="help-body" id="helpBody">
<!--HELP-->
      </div>
    </aside>

    <div class="splitter" role="separator" aria-orientation="vertical" title="Drag to resize, or double-click to reset"></div>

    <section class="bench" aria-label="Workbench">
      <div class="wb-tabs" role="tablist">
        <button class="wb-tab rail-btn" type="button" id="helpRail" title="Show the help (Ctrl+\)" hidden><!--ICON:sidebarOpen--><span>Help</span></button>
        <button class="wb-tab on" type="button" role="tab" data-wb="studio" title="Pedigree Studio: draw a family"><!--ICON:pedigree--><span class="lbl">Studio</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="tools" title="Tools: convert, match terms, check – point and click"><!--ICON:wrench--><span class="lbl">Tools</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="risk" title="Risk: the chance that someone carries a family’s variant, or that a child will be affected"><!--ICON:percent--><span class="lbl">Risk</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="editor" title="Files"><!--ICON:folder--><span class="lbl">Files</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="notebook" title="Notebook: Python, with the pedigree packages"><!--ICON:notebook--><span class="lbl">Notebook</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="terminal" title="Terminal: the pedigree programs as commands"><!--ICON:terminal--><span class="lbl">Terminal</span><span class="dot"></span></button>
      </div>
      <div class="wb-body">
        <div class="wb-pane" data-wb="studio"><div id="studioRoot" class="pw-root"></div></div>
        <div class="wb-pane" data-wb="tools" hidden><div id="toolsRoot" class="pw-root"></div></div>
        <div class="wb-pane" data-wb="risk" hidden><div id="riskRoot" class="pw-root"></div></div>
        <div class="wb-pane" data-wb="editor" hidden><div id="edRoot"></div></div>
        <div class="wb-pane" data-wb="notebook" hidden><div id="nbRoot"></div></div>
        <div class="wb-pane" data-wb="terminal" hidden><div id="termRoot"></div></div>
      </div>
    </section>
  </div>
</div>
